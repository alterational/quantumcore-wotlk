name: proton-sdk

# Выгрузка публичных папок Proton Drive официальным SDK (@protontech/drive-sdk)
# и скан на раннере. Замена proton-grab: браузерная автоматизация pdown с
# датацентровых IP не проходит проверки Proton (таймауты навигации), а SDK
# идёт по протоколу (SRP публичной ссылки + расшифровка) без браузера.
# Результат коммитится в dumps/_inbox/ после каждой папки (лог раннера и
# артефакты извне недоступны, единственный канал обратно — git push).

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/proton-sdk.trigger'
      - '.github/workflows/proton-sdk.yml'

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Setup tools
        run: |
          mkdir -p dumps/_inbox/_debug
          set -x
          sudo apt-get update -qq 2>&1 | tail -3 || true
          sudo apt-get install -y -qq p7zip-full bsdtar file 2>&1 | tail -3 || true
          sudo apt-get install -y -qq unrar p7zip-rar 2>&1 | tail -3 || true
          { python3 --version; 7z | head -2; unrar 2>&1 | head -2; node --version; } \
            > dumps/_inbox/_debug/tools-sdk.txt 2>&1 || true
          cat dumps/_inbox/_debug/tools-sdk.txt

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install SDK deps
        working-directory: tools/proton
        run: |
          npm install 2>&1 | tail -3
          ls node_modules/@protontech

      - name: Build YTDB baseline
        run: |
          git clone -q --filter=blob:none --sparse https://github.com/NeatElves/wotlk-ytdbdb.git /tmp/ytdb
          cd /tmp/ytdb && git sparse-checkout set Full_DB
          zcat Full_DB/*.sql.gz > /tmp/ytdb_full.sql
          cd "$GITHUB_WORKSPACE"
          python3 tools/build_baseline.py /tmp/ytdb_full.sql /tmp/ytdb_baseline.json \
            2>&1 | tee dumps/_inbox/_debug/baseline-sdk.log

      - name: Grab and scan shares
        run: |
          git config user.name "proton-grab-bot"
          git config user.email "proton-grab-bot@users.noreply.github.com"
          cat > urls.txt <<'EOF'
          https://drive.proton.me/urls/8PCYG3JM28#Y41FGLgoCjVJ
          https://drive.proton.me/urls/CKKS59QVSW#as8qO2Tmb0pI
          https://drive.proton.me/urls/215P57RKJ8#6VJRPgb7t3vR
          https://drive.proton.me/urls/8D70Y2M5M8#aBCvZ0fiejWB
          https://drive.proton.me/urls/X2K7F5PFA4#jqTjzTCwC4QY
          https://drive.proton.me/urls/G194XVGDR8#Khcglcbfrqn6
          EOF
          commit_back() {
            git add -A dumps/_inbox || true
            if git diff --cached --quiet; then echo "no changes"; return 0; fi
            git commit -q -m "$1" || return 0
            for i in 1 2 3; do
              git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
              git push -q origin "HEAD:${GITHUB_REF_NAME}" && return 0
              sleep 5
            done
            echo "push failed after retries"
          }
          n=0
          while read -r url; do
            n=$((n + 1))
            id=$(echo "$url" | sed -E 's|.*/urls/([A-Za-z0-9]+)#.*|\1|')
            label="${n}-${id}"
            echo "================ [$n] $id :: $url"
            mkdir -p "dumps/_inbox/listings" "dumps/_inbox/$label"
            dl="proton_dl/$label"
            mkdir -p "$dl"
            timeout 2400 bun tools/proton/main.ts dl "$url" "$dl" \
              > "dumps/_inbox/$label/download.log" 2>&1 \
              && echo "DL OK $id" || echo "DL FAILED($?) $id"
            cp "$dl/_tree.json" "dumps/_inbox/listings/${label}.tree.json" 2>/dev/null || true
            du -sh "$dl" || true
            # распаковка архивов: до 3 уровней вложенности, рядом с архивом в <имя>.x/
            for depth in 1 2 3; do
              found=0
              while IFS= read -r -d '' arc; do
                [ -f "$arc.done" ] && continue
                found=1
                out="$arc.x"
                mkdir -p "$out"
                echo "extract($depth): $arc"
                7z x -y -o"$out" "$arc" > /dev/null 2>&1 \
                  || unrar x -o+ -y "$arc" "$out/" > /dev/null 2>&1 \
                  || bsdtar -xf "$arc" -C "$out" > /dev/null 2>&1 \
                  || echo "EXTRACT FAILED: $arc"
                touch "$arc.done"
              done < <(find "$dl" -type f \( -iname '*.zip' -o -iname '*.rar' -o -iname '*.7z' \
                        -o -iname '*.tar.gz' -o -iname '*.tgz' -o -iname '*.tar' -o -iname '*.sql.gz' \) -print0)
              [ "$found" = "0" ] && break
            done
            find "$dl" -name '*.done' -delete
            python3 tools/scan_proton.py "$dl" "dumps/_inbox/$label" \
              /tmp/ytdb_baseline.json "$label" || echo "SCAN FAILED $id"
            du -sh "dumps/_inbox/$label" || true
            commit_back "data(proton): скан папки $label (SDK)"
          done < urls.txt
          echo "ALL DONE"

      - name: Commit debug (always)
        if: always()
        run: |
          git config user.name "proton-grab-bot"
          git config user.email "proton-grab-bot@users.noreply.github.com"
          mkdir -p dumps/_inbox/_debug
          { echo "job status: ${{ job.status }}"; date -u; df -h / | tail -2; \
            du -sh proton_dl dumps/_inbox 2>/dev/null; } > dumps/_inbox/_debug/job-sdk.txt 2>&1 || true
          git add -A dumps/_inbox || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "data(proton): отладочные логи запуска (SDK)" || exit 0
          for i in 1 2 3; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "push failed after retries"
