name: pages

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
      - main
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Пробуем включить GitHub Pages (если ещё не включён)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages" \
            -f 'source[branch]=${{ github.ref_name }}' -f 'source[path]=/' \
            && echo "Pages включён для ветки ${{ github.ref_name }}" \
            || echo "Нет прав на включение Pages — включите вручную: Settings → Pages → Deploy from a branch"

      - name: Готовим файлы сайта
        run: |
          mkdir -p _site
          cp -r index.html assets data .nojekyll README.md _site/
          mkdir -p _site/sql && cp sql/item_template.sql _site/sql/
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
